name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\Flake.sln -m:1

      - name: Build
        run: dotnet build .\Flake.sln --configuration Release --no-restore -m:1

      - name: Run geometry tests
        run: dotnet run --project .\tests\Flake.Tests\Flake.Tests.csproj --configuration Release --no-build
